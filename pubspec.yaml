name: bitree
description: "面向北京理工大学的本地跨平台工具集"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^11.0.0
  cookie_jar: ^4.0.8
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  file_picker: ^13.2.0
  package_info_plus: ^10.2.2
  pub_semver: ^2.2.1
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/bitree.png
